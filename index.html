<!DOCTYPE html>
<html lang="pt-br">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale-+1,0">
  <title>Blog de Anime</title>
  <style>
      header{
          background-color: #967aa1;
          color: #f5e6e8;
          text-aling.: center;
          max-width: 800px;
          margin: 0 auto;
          padding: 16px;
     }
    main { 
      background-color: #FFFFFF;
      color: #967aa1;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
    }
    img{
        width: 80px;
        height: 80px;
    }
    .artigo-autor {
        font-weight: bold;
    }
  </style>
</head>
  <body>
    <header>
    <h1>Meu Blog de Anime</h1>
    <p>Vou compartilhar curiosidades sobre animes japoneses</p>
    </header>
    <main>
    <img src="https://gemini.google.com/693a00ff-6889-4c56-98e1-0f0738495a2c" alt="Ilustração em estilo anime de quatro estudantes reunidos em uma ponte ao anoitecer em Tóquio, com a Torre de Tóquio, prédios iluminados e cerejeiras ao fundo.">
      <div>
    <h2>Meu blog de anime</h2>
    <p class="artigo-autor">Por: Maria Eduarda Siqueira Lopes</p>
    <p>Boas-vindas ao meu blog! Aqui vou compartilhar curiosidades sobre a cultura dos animes no japão</p>
        <button>❤️ <span>0</span></button>
        <button>👍 <span>0</span></button>
      </div>
    </main>  
  </body>
  <script>
      const botoes = document.querySelectorAll("button");

      botoes.forEach( function(botao){
       botao.addEventListener("click", botaoClicado);

      function botaoClicado(){
          console.log("fui cliclado");
          let texto = botao.querySelector("span");
          texto.textContent++;
      }
      
      })

    
  </script>
</html>
